<script>
  // Simple haptic tap simulation and micro-animations
  document.querySelectorAll('#board-matrix button').forEach(button => {
    button.addEventListener('click', () => {
      // Tap feedback
      button.classList.add('scale-90', 'opacity-70');
      setTimeout(() => {
        button.classList.remove('scale-90', 'opacity-70');
      }, 140);
    });
  });

  const hintBtn = document.getElementById('tool-hint');
  if (hintBtn) {
    hintBtn.addEventListener('click', () => {
      const hintTile = document.querySelector('.animate-ping')?.parentElement;
      if (hintTile) {
        hintTile.classList.add('scale-110');
        setTimeout(() => hintTile.classList.remove('scale-110'), 250);
      }
    });
  }
